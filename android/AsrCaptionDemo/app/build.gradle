plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.asrdemo'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.asrdemo"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // 去掉 x86/x86_64（模拟器/ChromeOS 才用），省 ~69MB；真机为 32 位 arm
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // 内嵌模型已是 int8/混合精度，压缩收益有限，且需避免解包时二次拷贝
    androidResources {
        noCompress 'onnx'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
}
